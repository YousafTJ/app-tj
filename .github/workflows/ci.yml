name: Next.js CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    byg-og-test:
        runs-on: ubuntu-latest

        steps:
        - name: Hent koden
          uses: actions/checkout@v4

        - name: Installer Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: npm

        - name: Installer pakker
          run: npm ci

        - name: Byg Next.js app
          run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN_APP }}
          env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_APP }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_APP }}

        - name: Deploy til Vercel
          run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_APP }}
          env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_APP }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_APP }}
